name: Green Graph Garden

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Grow the graph
        run: node scripts/daily-green.js

      - name: Commit the bloom
        run: |
          git config user.name "Green Graph Bot"
          git config user.email "green-graph-bot@users.noreply.github.com"
          git add README.md log.txt data/green-status.json
          git diff --cached --quiet || git commit -m "🌿 grow the garden $(date -u +%Y-%m-%d)"
          git push origin HEAD:${{ github.ref_name }}

name: Daily Commit

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update repository pulse
        run: |
          set -euo pipefail
          today="$(date -u '+%a %b %-d %Y')"
          if ! grep -qF -- "$today" log.txt; then
            printf '%s - commit by GitHub Actions\n' "$(date -u '+%a %b %-d %H:%M:%S UTC %Y')" >> log.txt
          fi
          python scripts/generate_activity.py

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "ahmadrz1379"
          git config user.email "aahmadrezarezaee@gmail.com"
          git add .
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "daily green update - $(date -u '+%Y-%m-%d')"
          git push origin HEAD:main
